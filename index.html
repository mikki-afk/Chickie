<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期期的小鸡养成系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#ffecd2,#fcb69f);min-height:100vh;display:flex;justify-content:center;padding:10px;user-select:none}
.container{width:100%;max-width:820px}
h1{text-align:center;font-size:26px;padding:14px 0 8px;color:#5a3e2b;text-shadow:1px 1px 2px rgba(255,255,255,.5)}

/* ===== CHICKEN SPRITE ===== */
.chick{display:inline-block;position:relative;width:50px;height:48px}
.chick.big{transform:scale(1.7);transform-origin:bottom center;margin:28px 18px 8px}
.chick.med{transform:scale(1.3);transform-origin:bottom center;margin:2px}
.chick-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:28px;border-radius:50%;background:#FFD700;box-shadow:inset -2px -2px 5px rgba(0,0,0,.1),inset 2px 2px 5px rgba(255,255,255,.3)}
.chick-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:26px;border-radius:50%;background:#FFD700;box-shadow:inset -2px -2px 4px rgba(0,0,0,.08),inset 2px 2px 4px rgba(255,255,255,.3);z-index:2}
.chick-hair{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:7px solid #FFA500;z-index:3}
/* Sleep cap */
.chick-cap{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(15deg);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #9370DB;border-radius:2px;z-index:7;opacity:0;transform-origin:bottom center}
.chick-cap::after{content:"";position:absolute;top:-3px;left:-2px;width:4px;height:4px;background:#fff;border-radius:50%}
.chick-cap::before{content:"";position:absolute;bottom:-1px;left:-10px;width:20px;height:4px;background:#7c5cbf;border-radius:2px}
.expr-sleep .chick-cap{opacity:1}
.chick-eyes{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:16px;display:flex;justify-content:space-between;z-index:4}
.chick-eye{width:4px;height:4px;border-radius:50%;background:#2c1810}
.chick-beak{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #FF8C00;z-index:4}
.chick-blush{position:absolute;top:11px;width:5px;height:3px;border-radius:50%;background:rgba(255,100,100,.4);z-index:4}
.chick-blush.L{left:2px}.chick-blush.R{right:2px}
.chick-tear{position:absolute;top:12px;width:2px;height:5px;background:#74b9ff;border-radius:0 0 2px 2px;z-index:5;opacity:0}
.chick-tear.L{left:5px}.chick-tear.R{right:5px}
.chick-hearts{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:6;opacity:0;font-size:9px;pointer-events:none}
.chick-zzz{position:absolute;top:-8px;right:-6px;font-size:9px;font-weight:700;color:#9370DB;z-index:6;opacity:0;pointer-events:none}
.chick-sweat{position:absolute;top:3px;right:0;width:3px;height:4px;background:#74b9ff;border-radius:50% 50% 50% 0;transform:rotate(45deg);z-index:6;opacity:0}
.chick-wing{position:absolute;bottom:6px;width:8px;height:12px;border-radius:50%;background:#f0c000;z-index:1}
.chick-wing.L{left:0;transform:rotate(15deg)}.chick-wing.R{right:0;transform:rotate(-15deg)}
.chick-feet{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.chick-foot{width:7px;height:2px;background:#FF8C00;border-radius:0 0 2px 2px}

/* Expressions */
.expr-happy .chick-eye{height:2px;border-radius:3px 3px 0 0;margin-top:1px}
.expr-happy .chick-beak,.expr-love .chick-beak,.expr-adore .chick-beak,.expr-satisfied .chick-beak{border-top:0;border-bottom:3px solid #FF8C00;top:15px}
.expr-happy .chick-blush,.expr-satisfied .chick-blush{opacity:.7}
.expr-love .chick-eye{background:#e74c3c;width:5px;height:5px}
.expr-love .chick-blush,.expr-adore .chick-blush{opacity:1;background:rgba(255,80,80,.7)}
.expr-love .chick-hearts,.expr-adore .chick-hearts{opacity:1;animation:heartF 1.5s ease infinite}
.expr-adore .chick-eye{height:2px;border-radius:3px 3px 0 0;background:#e74c3c;margin-top:1px;width:5px}
.expr-sad .chick-eye{border-radius:0 0 4px 4px;height:3px}
.expr-sad .chick-tear.L{opacity:.7;animation:tearD 1.5s ease-in infinite}
.expr-cry .chick-eye{border-radius:0 0 4px 4px;height:3px}
.expr-cry .chick-tear{opacity:1;animation:tearD 1s ease-in infinite}
.expr-cry .chick-beak{border-top:3px solid #FF8C00;border-bottom:0;top:16px}
.expr-upset .chick-eye{width:5px;height:2px;border-radius:0;border-bottom:2px solid #2c1810;background:none}
.expr-upset .chick-sweat,.expr-meh .chick-sweat{opacity:.8}
.expr-meh .chick-eye{height:2px;border-radius:1px;margin-top:2px}
.expr-sleep .chick-eye{height:2px;border-radius:2px;margin-top:2px;width:5px}
.expr-sleep .chick-beak{width:5px;height:2px;border:none;background:#FF8C00;border-radius:1px;top:15px;margin-left:-2px}
.expr-sleep .chick-blush{opacity:.3}
.expr-sleep .chick-zzz{opacity:1;animation:zzzF 2s ease-in-out infinite}
.expr-satisfied .chick-eye{height:2px;border-radius:3px 3px 0 0;margin-top:1px}
.expr-normal .chick-blush{opacity:.3}

/* Stage extras (hidden by default) */
.chick-comb{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:3;opacity:0;pointer-events:none}
.chick-wattle{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:4px;height:5px;background:#e74c3c;border-radius:0 0 50% 50%;z-index:5;opacity:0}
.chick-glasses{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:20px;height:8px;z-index:6;opacity:0;pointer-events:none}
.chick-glasses::before,.chick-glasses::after{content:"";position:absolute;top:0;width:8px;height:7px;border:1.5px solid #555;border-radius:50%}
.chick-glasses::before{left:0}.chick-glasses::after{right:0}
.chick-tail{position:absolute;bottom:8px;right:-4px;width:0;height:0;border-left:6px solid transparent;border-right:0;border-bottom:8px solid #f0c000;z-index:0;opacity:0;transform:rotate(-20deg)}

/* Stage: baby (default) - small yellow round chick, same for all */

/* Stage: teen - slightly bigger, feathers starting to show individual color */
.stage-teen .chick-body{width:36px;height:30px;background:var(--feather,#FFD700)}
.stage-teen .chick-head{width:30px;height:28px;background:var(--feather,#FFD700)}
.stage-teen .chick-hair{border-bottom-width:8px;border-bottom-color:var(--col2,#FFA500)}
.stage-teen .chick-wing{width:9px;height:14px;background:var(--col1,#f0c000)}
.stage-teen .chick-tail{opacity:1;border-bottom-color:var(--feather,#f0c000)}

/* Stage: mature - bigger, comb growing, individual plumage */
.stage-mature .chick-body{width:38px;height:32px;background:var(--feather,#f5e050)}
.stage-mature .chick-head{width:32px;height:30px;background:var(--feather,#f5e050)}
.stage-mature .chick-wing{width:10px;height:15px;background:var(--col1,#e0b800)}
.stage-mature .chick-hair{border-bottom-width:9px;border-bottom-color:var(--col2,#e67e22)}
.stage-mature .chick-comb{opacity:1;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:8px solid var(--comb,#e74c3c);top:-7px}
.stage-mature .chick-wattle{opacity:.6;height:4px;background:var(--comb,#e74c3c)}
.stage-mature .chick-tail{opacity:1;border-bottom-color:var(--col1,#e0b800);border-bottom-width:10px;border-left-width:7px}
.stage-mature .chick-feet .chick-foot{width:8px;height:3px}
.stage-mature .chick-eye{width:5px;height:5px}

/* Stage: adult - full grown, unique plumage color per chicken */
.stage-adult .chick-body{width:40px;height:34px;background:var(--plumage,#f5f5f5)}
.stage-adult .chick-head{width:34px;height:32px;background:var(--plumage,#f5f5f5)}
.stage-adult .chick-wing{width:11px;height:16px;background:var(--feather,#e0e0e0)}
.stage-adult .chick-hair{border-bottom-color:var(--comb,#e74c3c);border-bottom-width:10px;border-left-width:4px;border-right-width:4px}
.stage-adult .chick-comb{opacity:1;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:10px solid var(--comb,#e74c3c);top:-8px}
.stage-adult .chick-wattle{opacity:1;height:6px;width:5px;background:var(--comb,#e74c3c)}
.stage-adult .chick-tail{opacity:1;border-bottom-color:var(--feather,#d0d0d0);border-bottom-width:12px;border-left-width:8px;right:-6px}
.stage-adult .chick-feet .chick-foot{width:9px;height:3px}
.stage-adult .chick-eye{width:5px;height:5px}
.stage-adult .chick-beak{border-left-width:4px;border-right-width:4px;border-top-width:5px}

/* Stage: elder - softer colors, glasses, gentle vibe */
.stage-elder .chick-body{width:38px;height:32px;background:var(--plumage,#f0ece0);opacity:.9}
.stage-elder .chick-head{width:32px;height:30px;background:var(--plumage,#f0ece0);opacity:.9}
.stage-elder .chick-wing{width:10px;height:14px;background:var(--feather,#ddd8c8);opacity:.85}
.stage-elder .chick-hair{border-bottom-color:var(--comb,#c0392b);border-bottom-width:9px;border-left-width:4px;border-right-width:4px;opacity:.8}
.stage-elder .chick-comb{opacity:.8;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--comb,#c0392b);top:-7px}
.stage-elder .chick-wattle{opacity:.8;height:5px;width:5px;background:var(--comb,#c0392b)}
.stage-elder .chick-tail{opacity:.8;border-bottom-color:var(--feather,#d8d0c0);border-bottom-width:10px;border-left-width:7px;right:-5px}
.stage-elder .chick-glasses{opacity:1}
.stage-elder .chick-feet .chick-foot{width:8px;height:3px}
.stage-elder .chick-eye{width:4px;height:4px}
.stage-elder .chick-blush{opacity:.5!important}

/* Tail style variations per chicken */
.tail-fluffy .chick-tail{border-radius:0 0 3px 0;border-left-width:8px!important}
.tail-sleek .chick-tail{transform:rotate(-30deg)!important}
.tail-curly .chick-tail{border-radius:0 4px 4px 0;transform:rotate(-10deg)!important}
.tail-spiky .chick-tail{border-left-width:4px!important;border-bottom-width:14px!important;transform:rotate(-25deg)!important}
.tail-round .chick-tail{border-radius:50%;width:8px!important;height:8px!important;border:none!important;background:var(--feather,#d0c0e8)}

/* Animations */
@keyframes heartF{0%{transform:translateX(-50%) translateY(0);opacity:1}100%{transform:translateX(-50%) translateY(-10px);opacity:0}}
@keyframes tearD{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes zzzF{0%,100%{opacity:.4;transform:translateY(0) scale(.8)}50%{opacity:1;transform:translateY(-6px) scale(1.1)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes breatheBig{0%,100%{transform:scale(1.7) translateY(0)}50%{transform:scale(1.7) translateY(-2px)}}
@keyframes breatheMed{0%,100%{transform:scale(1.3) translateY(0)}50%{transform:scale(1.3) translateY(-2px)}}
.chick{animation:breathe 2s ease-in-out infinite}
.chick.big{animation:breatheBig 2s ease-in-out infinite!important}
.chick.med{animation:breatheMed 2s ease-in-out infinite!important}
.stage-elder{animation-duration:3s!important}
.stage-elder.big{animation:breatheBig 3s ease-in-out infinite!important}
.stage-elder.med{animation:breatheMed 3s ease-in-out infinite!important}
.big.anim-eat{animation:eatB .4s ease 5!important}
@keyframes eatB{0%,100%{transform:scale(1.7) rotate(0)}50%{transform:scale(1.7) rotate(12deg) translateY(3px)}}
.big.anim-chase{animation:chaseB .8s ease 3!important}
@keyframes chaseB{0%{transform:scale(1.7) translateX(0)}25%{transform:scale(1.7) translateX(-18px)}75%{transform:scale(1.7) translateX(18px)}100%{transform:scale(1.7) translateX(0)}}
.big.anim-jump{animation:jumpB .5s ease 4!important}
@keyframes jumpB{0%,100%{transform:scale(1.7) translateY(0)}40%{transform:scale(1.7) translateY(-16px)}}
.big.anim-roll{animation:rollB .8s linear 3!important}
@keyframes rollB{0%{transform:scale(1.7) rotate(0)}100%{transform:scale(1.7) rotate(360deg)}}
.big.anim-sleep{animation:sleepB 2s ease-in-out infinite!important}
@keyframes sleepB{0%,100%{transform:scale(1.7) translateY(0)}50%{transform:scale(1.7) translateY(2px)}}
.big.anim-wake{animation:wakeB .6s ease 2!important}
@keyframes wakeB{0%,100%{transform:scale(1.7) scaleY(1)}50%{transform:scale(1.7) scaleY(1.15)}}
.big.anim-drink{animation:drinkB .5s ease 4!important}
@keyframes drinkB{0%,100%{transform:scale(1.7) rotate(0)}50%{transform:scale(1.7) rotate(-10deg) translateY(3px)}}
.big.anim-bath{animation:bathB .6s ease 4!important}
@keyframes bathB{0%,100%{transform:scale(1.7) translateY(0)}30%{transform:scale(1.7) translateY(4px)}60%{transform:scale(1.7) translateY(-2px) rotate(5deg)}}

/* ===== YARD ===== */
.yard{border-radius:18px;border:4px solid #8B4513;margin-bottom:12px;position:relative;overflow:hidden}
.sky{position:relative;height:120px;background:linear-gradient(180deg,#5ba3d9 0%,#87CEEB 100%);overflow:hidden;transition:background .5s}
.sky.cloudy{background:linear-gradient(180deg,#8899aa 0%,#a0b4c8 100%)}
.sky.rainy{background:linear-gradient(180deg,#607080 0%,#8090a0 100%)}
.sky.snowy{background:linear-gradient(180deg,#b0b8c8 0%,#c8d0e0 100%)}

/* Sun */
.sun{position:absolute;top:14px;right:30px;width:40px;height:40px;background:#FFE033;border-radius:50%;box-shadow:0 0 20px 8px rgba(255,224,51,.5),0 0 40px 15px rgba(255,200,0,.2);transition:opacity .5s}
.sky.cloudy .sun{opacity:.3;box-shadow:none}
.sky.rainy .sun{opacity:0}
.sky.snowy .sun{opacity:.15;box-shadow:none}

/* Clouds - CSS drawn */
.cloud-wrap{position:absolute;pointer-events:none}
.cloud-shape{background:#fff;border-radius:50%;position:absolute}
.cw1{top:15px;left:10%;animation:drift 12s ease-in-out infinite}
.cw2{top:35px;left:45%;animation:drift 16s ease-in-out infinite reverse}
.cw3{top:10px;left:75%;animation:drift 10s ease-in-out infinite}
.sky.cloudy .cloud-shape{background:#d0d8e0}
.sky.rainy .cloud-shape{background:#8090a0}
.sky.snowy .cloud-shape{background:#c0c8d8}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}

/* Rain */
.rain{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s}
.sky.rainy .rain{opacity:1}
.sky.snowy .rain{opacity:1}
.snowflake{position:absolute;color:#fff;font-size:10px;animation:snowFall linear infinite;opacity:.8}
@keyframes snowFall{0%{transform:translateY(-20px) rotate(0deg)}100%{transform:translateY(130px) rotate(360deg)}}
.raindrop{position:absolute;width:2px;background:linear-gradient(transparent,#a0c0ff);border-radius:0 0 2px 2px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px)}100%{transform:translateY(130px)}}

/* Weather indicator */
.weather-badge{position:absolute;top:6px;left:8px;background:rgba(255,255,255,.5);border-radius:10px;padding:2px 8px;font-size:11px;z-index:10;backdrop-filter:blur(2px)}

/* Coops row - at sky/grass boundary */
.coops-area{position:relative;background:linear-gradient(180deg,#7dbe6b 0%,#6db35a 100%);padding:8px 10px 4px;border-top:3px solid #5a8a4a}
.coops-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.coop{width:88px;text-align:center;cursor:pointer;transition:transform .2s}
.coop:hover{transform:scale(1.05)}
.coop-building{width:72px;height:56px;margin:0 auto;border-radius:4px 4px 0 0;position:relative;border:2px solid rgba(0,0,0,.1)}
.coop-roof{position:absolute;top:-14px;left:-5px;right:-5px;height:18px;border-radius:4px 4px 0 0;border:2px solid rgba(0,0,0,.1)}
.coop-door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:18px;height:26px;border-radius:9px 9px 0 0;background:rgba(0,0,0,.2);transition:all .3s}
.coop-door.open{height:6px;border-radius:3px 3px 0 0;background:rgba(0,0,0,.06)}
.coop-window{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45);border:1px solid rgba(0,0,0,.08)}
.coop-name{font-size:10px;font-weight:700;margin-top:2px;color:#3a5a2a}
.coop-btn{font-size:10px;padding:2px 6px;border:none;border-radius:6px;cursor:pointer;margin-top:1px;background:rgba(255,255,255,.7);color:#3a5a2a;font-weight:600}
.coop-btn:hover{background:#fff}

/* Yard ground */
.yard-ground{position:relative;min-height:190px;background:linear-gradient(180deg,#6db35a 0%,#5a9a48 100%);padding:10px}

/* Grass tufts */
.grass{position:absolute;pointer-events:none;z-index:0}
.grass-blade{position:absolute;bottom:0;width:3px;border-radius:2px 2px 0 0}

/* Yard chickens */
.yard-chicken{position:absolute;text-align:center;cursor:pointer;transition:left 2.5s ease-in-out,top 2.5s ease-in-out;z-index:3}
.yard-chicken .yc-name{font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);border-radius:4px;padding:0 4px;white-space:nowrap;display:block;margin-top:1px}
.yard-chicken .yc-status{font-size:8px;color:#ffe0e0;font-weight:600;min-height:12px;display:block}
.yard-bars{display:flex;gap:2px;justify-content:center;margin-top:1px}
.yard-bar-track{width:22px;height:3px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden}
.yard-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.yard-bar-fill.h{background:#ff6b6b}.yard-bar-fill.p{background:#ffd93d}.yard-bar-fill.w{background:#74b9ff}

/* Yard items */
.yard-items{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-around;padding:0 15%;z-index:1;pointer-events:none}
.yard-item{text-align:center;transform:scale(.7);transform-origin:bottom center}
.yard-item-label{font-size:8px;color:#fff;background:rgba(0,0,0,.2);border-radius:3px;padding:0 3px;margin-top:2px;display:block}

/* Yard actions */
.yard-actions{background:rgba(0,0,0,.15);padding:8px 10px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}

/* Chicken popup menu */
.chicken-menu{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.2);padding:5px;z-index:100;white-space:nowrap}
.chicken-menu.show{display:flex;gap:3px}
.chicken-menu button{padding:4px 8px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;background:#f0f0f0}
.chicken-menu button:hover{background:#ddd}

/* ===== ROOM VIEW ===== */
.room-view{display:none}.room-view.active{display:block}
.yard-view.hidden{display:none}
.room{border-radius:18px;border:3px solid rgba(0,0,0,.08);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;min-height:280px}
.room-header{text-align:center;font-size:18px;font-weight:700;color:#5a3e2b;margin-bottom:8px}
.room-scene{display:flex;justify-content:space-around;align-items:flex-end;min-height:180px;position:relative;padding:10px 10px 0}

/* CSS Furniture */
.furniture{text-align:center;flex-shrink:0;position:relative;z-index:1}
.furniture .fur-label{font-size:10px;color:#5a3e2b;font-weight:600;margin-top:3px}

/* Bed */
.css-bed{width:100px;height:52px;position:relative}
.bed-frame{width:100px;height:34px;background:#8B6914;border-radius:6px;position:absolute;bottom:0;border:3px solid #6B4F10}
.bed-mattress{width:88px;height:22px;background:#FFE4B5;border-radius:4px;position:absolute;bottom:6px;left:6px}
.bed-pillow{width:26px;height:18px;background:#fff;border-radius:5px;position:absolute;bottom:10px;left:10px;border:2px solid #ddd}
.bed-blanket{width:52px;height:18px;background:#FFB6C1;border-radius:0 0 4px 4px;position:absolute;bottom:6px;right:10px;opacity:.8}

/* Food bowl */
.css-bowl{width:66px;height:42px;position:relative}
.bowl-body{width:66px;height:30px;background:#D2691E;border-radius:0 0 26px 26px;position:absolute;bottom:0;border:3px solid #8B4513}
.bowl-inner{width:52px;height:16px;background:#F5DEB3;border-radius:0 0 18px 18px;position:absolute;bottom:6px;left:7px}
.bowl-food{width:38px;height:10px;background:#DAA520;border-radius:50%;position:absolute;top:-3px;left:50%;transform:translateX(-50%)}

/* Water bowl */
.css-water{width:62px;height:42px;position:relative}
.water-body{width:62px;height:30px;background:#4682B4;border-radius:0 0 24px 24px;position:absolute;bottom:0;border:3px solid #2c5f8a}
.water-inner{width:48px;height:16px;background:#87CEEB;border-radius:0 0 18px 18px;position:absolute;bottom:6px;left:7px;overflow:hidden}
.water-surface{width:100%;height:6px;background:rgba(255,255,255,.4);border-radius:50%;position:absolute;top:0;animation:waterWave 2s ease-in-out infinite}
@keyframes waterWave{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}

/* Room chicken */
.room-chicken-wrap{position:absolute;text-align:center;transition:left 1.5s ease-in-out;z-index:5;bottom:15px}
.room-reaction{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:16px;opacity:0;pointer-events:none;white-space:nowrap}
.room-reaction.show{opacity:1;animation:reactPop 2s ease forwards}
@keyframes reactPop{0%{opacity:0;transform:translateX(-50%) scale(.5)}20%{opacity:1;transform:translateX(-50%) scale(1.1)}40%{transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* Room window */
.room-window{position:absolute;top:12px;right:16px;width:70px;height:55px;z-index:2}
.win-frame{width:70px;height:55px;border:4px solid #8B6914;border-radius:4px;position:relative;overflow:hidden;background:#87CEEB}
.win-cross-h{position:absolute;top:50%;left:0;right:0;height:3px;background:#8B6914;transform:translateY(-50%);z-index:2}
.win-cross-v{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#8B6914;transform:translateX(-50%);z-index:2}
.win-sky{position:absolute;inset:0;transition:background .5s}
.win-sky.sunny{background:linear-gradient(180deg,#5ba3d9,#87CEEB)}
.win-sky.cloudy{background:linear-gradient(180deg,#8899aa,#a0b4c8)}
.win-sky.rainy{background:linear-gradient(180deg,#607080,#8090a0)}
.win-sky.snowy{background:linear-gradient(180deg,#b0b8c8,#c8d0e0)}
.win-sun{position:absolute;top:6px;right:6px;width:12px;height:12px;background:#FFE033;border-radius:50%;box-shadow:0 0 6px rgba(255,224,51,.6);transition:opacity .5s}
.win-sky.cloudy .win-sun{opacity:.3;box-shadow:none}
.win-sky.rainy .win-sun,.win-sky.snowy .win-sun{opacity:0}
.win-cloud{position:absolute;top:8px;left:6px;width:16px;height:6px;background:#fff;border-radius:10px}
.win-cloud::before{content:"";position:absolute;top:-3px;left:4px;width:8px;height:5px;background:#fff;border-radius:50%}
.win-sky.cloudy .win-cloud,.win-sky.rainy .win-cloud{background:#c0c8d0}
.win-sky.cloudy .win-cloud::before,.win-sky.rainy .win-cloud::before{background:#c0c8d0}
.win-rain-drop{position:absolute;width:1px;height:4px;background:rgba(160,192,255,.7);animation:winRain .6s linear infinite}
@keyframes winRain{0%{transform:translateY(-4px)}100%{transform:translateY(55px)}}
.win-snowflake{position:absolute;font-size:5px;color:#fff;animation:winSnow 2s linear infinite}
@keyframes winSnow{0%{transform:translateY(-4px)}100%{transform:translateY(55px)}}
/* Curtain */
.win-curtain-l,.win-curtain-r{position:absolute;top:0;width:50%;height:100%;z-index:3;transition:width .5s ease}
.win-curtain-l{left:0;border-radius:2px 0 0 2px}
.win-curtain-r{right:0;border-radius:0 2px 2px 0}
.win-curtain-l.open{width:12%}
.win-curtain-r.open{width:12%}
.win-curtain-l::after,.win-curtain-r::after{content:"";position:absolute;top:0;width:100%;height:100%;background:repeating-linear-gradient(180deg,transparent,transparent 4px,rgba(0,0,0,.04) 4px,rgba(0,0,0,.04) 5px)}
.win-label{text-align:center;font-size:9px;color:#5a3e2b;font-weight:600;margin-top:2px}

/* Ceiling light */
.room-ceiling-light{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;text-align:center}
.cl-wire{width:2px;height:14px;background:#888;margin:0 auto}
.cl-shade{width:36px;height:16px;background:linear-gradient(180deg,#ddd,#bbb);border-radius:0 0 18px 18px;border:2px solid #aaa;position:relative;margin:0 auto}
.cl-bulb{width:10px;height:8px;background:#eee;border-radius:50%;position:absolute;top:-4px;left:50%;transform:translateX(-50%)}
.cl-glow{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:50px solid rgba(255,245,200,.08);pointer-events:none;opacity:0;transition:opacity .3s}
.room-ceiling-light.on .cl-shade{background:linear-gradient(180deg,#ffd54f,#ffb300);border-color:#f9a825}
.room-ceiling-light.on .cl-bulb{background:#fff9c4;box-shadow:0 0 8px rgba(255,235,59,.8)}
.room-ceiling-light.on .cl-glow{opacity:1}

/* Room floor */
.room-floor{position:absolute;bottom:0;left:0;right:0;height:40px;border-radius:0 0 14px 14px}

/* Heater */
.css-heater{width:42px;height:52px;position:relative}
.heater-body{width:32px;height:44px;background:linear-gradient(180deg,#e0e0e0,#bbb);border-radius:4px;position:absolute;bottom:0;left:5px;border:2px solid #999}
.heater-lines{position:absolute;top:8px;left:10px;right:10px;height:28px}
.heater-line{width:100%;height:2px;background:#999;border-radius:1px;margin-bottom:4px}
.heater-feet{position:absolute;bottom:-3px;left:7px;right:7px;display:flex;justify-content:space-between}
.heater-foot{width:6px;height:4px;background:#888;border-radius:0 0 2px 2px}
/* Heater on glow */
.heater-on .heater-body{background:linear-gradient(180deg,#ff8a65,#ef5350);border-color:#d32f2f;box-shadow:0 0 12px rgba(255,80,50,.4)}
.heater-on .heater-line{background:#ff6b6b;box-shadow:0 0 4px rgba(255,80,50,.6)}
.heater-on::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:50px;height:20px;background:radial-gradient(ellipse,rgba(255,120,50,.15),transparent);pointer-events:none}
@keyframes heatWave{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.6;transform:translateY(-3px)}}
.heater-on .heater-wave{opacity:1;animation:heatWave 1.5s ease-in-out infinite}
.heater-wave{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:10px;opacity:0;pointer-events:none}

/* Heat lamp */
.css-lamp{width:36px;height:56px;position:relative}
.lamp-pole{width:4px;height:36px;background:#888;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.lamp-base{width:20px;height:4px;background:#777;border-radius:2px;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.lamp-head{width:28px;height:16px;background:linear-gradient(180deg,#aaa,#888);border-radius:14px 14px 2px 2px;position:absolute;top:0;left:50%;transform:translateX(-50%);border:2px solid #777}
.lamp-bulb{width:10px;height:6px;background:#ddd;border-radius:0 0 50% 50%;position:absolute;bottom:-2px;left:50%;transform:translateX(-50%)}
/* Lamp on glow */
.lamp-on .lamp-head{background:linear-gradient(180deg,#ffd54f,#ffb300);border-color:#f9a825}
.lamp-on .lamp-bulb{background:#fff176;box-shadow:0 0 8px rgba(255,235,59,.8)}
.lamp-on .lamp-cone{opacity:1}
.lamp-cone{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid rgba(255,235,59,.12);pointer-events:none;opacity:0}

/* Room warm overlay */
.room-warm{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;border-radius:16px;transition:opacity .5s;opacity:0;z-index:0}
.room-warm.active{opacity:1;background:radial-gradient(ellipse at center bottom,rgba(255,150,50,.06),transparent 70%)}
.room-dim{position:absolute;top:0;left:0;right:0;bottom:0;background:#1a1a2e;pointer-events:none;border-radius:16px;transition:opacity .5s;z-index:1}

/* Room bars */
.room-bars{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.room-bar-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.room-bar-label{font-size:12px;width:76px;color:#5a3e2b;font-weight:600}
.room-bar-track{flex:1;height:10px;background:rgba(0,0,0,.08);border-radius:5px;overflow:hidden}
.room-bar-fill{height:100%;border-radius:5px;transition:width .3s}
.room-bar-fill.hunger{background:linear-gradient(90deg,#ff6b6b,#ee5a24)}
.room-bar-fill.happiness{background:linear-gradient(90deg,#ffd93d,#f0932b)}
.room-bar-fill.thirst{background:linear-gradient(90deg,#74b9ff,#0984e3)}
.room-bar-val{font-size:12px;min-width:26px;text-align:right;color:#5a3e2b;font-weight:700;white-space:nowrap}
.room-growth{margin-top:4px}
.room-growth-label{font-size:10px;color:#888;margin-bottom:1px}
.room-growth-track{height:5px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden}
.room-growth-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#a29bfe,#6c5ce7);transition:width .3s}

/* Buttons */
.room-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.action-btn{padding:10px 14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.action-btn:hover:not(:disabled){transform:scale(1.05)}
.action-btn:active:not(:disabled){transform:scale(.97)}
.action-btn:disabled{background:#ccc!important;cursor:not-allowed;color:#999}
.btn-feed{background:linear-gradient(135deg,#FFD700,#f39c12)}
.btn-play{background:linear-gradient(135deg,#FF69B4,#e84393)}
.btn-drink{background:linear-gradient(135deg,#74b9ff,#0984e3)}
.btn-sleep{background:linear-gradient(135deg,#9370DB,#6c5ce7)}
.btn-wake{background:linear-gradient(135deg,#FF8C00,#e67e22)}
.btn-pet{background:linear-gradient(135deg,#fd79a8,#e84393)}
.btn-heater{background:linear-gradient(135deg,#ff8a65,#ef5350)}
.btn-lamp{background:linear-gradient(135deg,#ffd54f,#ffb300)}
.btn-exit{background:linear-gradient(135deg,#95a5a6,#7f8c8d)}
.cooldown-text{display:block;font-size:10px;font-weight:400;margin-top:1px}

/* Room controls (heater/lamp sliders) */
.room-controls{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 14px;margin-top:8px;margin-bottom:8px}
.rc-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.rc-label{font-size:12px;font-weight:600;color:#5a3e2b;min-width:90px;white-space:nowrap}
.rc-slider{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer}
.rc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rc-heater{background:linear-gradient(90deg,#e0e0e0,#ff8a65,#ef5350)}
.rc-heater::-webkit-slider-thumb{background:#ef5350}
.rc-lamp{background:linear-gradient(90deg,#e0e0e0,#ffd54f,#ffb300)}
.rc-lamp::-webkit-slider-thumb{background:#ffb300}
.rc-toggle{padding:6px 14px;border:2px solid #ddd;border-radius:8px;background:#f5f5f5;font-size:12px;font-weight:600;color:#5a3e2b;cursor:pointer;transition:all .2s;flex:1}
.rc-toggle:hover{background:#eee}
.rc-toggle.rc-on{background:#fff3e0;border-color:#ffb300;box-shadow:0 0 6px rgba(255,179,0,.3)}

/* Selection popup */
.sel-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;justify-content:center;align-items:center}
.sel-popup.show{display:flex}
.sel-box{background:#fff;border-radius:18px;padding:16px;max-width:340px;width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.sel-title{text-align:center;font-size:16px;font-weight:700;color:#5a3e2b;margin-bottom:10px}
.sel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sel-item{padding:8px 4px;border:2px solid #eee;border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;background:#fafafa}
.sel-item:hover{border-color:#f39c12;background:#fff8e7;transform:scale(1.05)}
.sel-item .si-icon{font-size:24px;display:block}
.sel-item .si-name{font-size:10px;color:#5a3e2b;font-weight:600;margin-top:2px}
.sel-item .pref{font-size:9px;margin-top:1px;min-height:12px}
.pref-like{color:#e74c3c}.pref-hate{color:#7f8c8d}
.sel-cancel{display:block;margin:10px auto 0;padding:6px 20px;border:none;border-radius:8px;background:#eee;cursor:pointer;font-size:12px;color:#888}

/* Stats */
.stats-bar{background:rgba(255,255,255,.85);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-around;font-size:13px;color:#5a3e2b;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.08);flex-wrap:wrap;gap:4px;margin-bottom:10px}
.stats-bar span{white-space:nowrap}
.reset-area{text-align:center;padding:6px 0 16px}
.reset-btn{background:none;border:1px dashed #c0a080;color:#b08060;padding:5px 16px;border-radius:8px;cursor:pointer;font-size:11px}
.reset-btn:hover{background:rgba(255,255,255,.4)}
.no-food-msg{font-size:11px;color:#e17055;text-align:center;margin-bottom:6px;display:none}
.no-food-msg.show{display:block}

/* Activity log */
.log-panel{background:rgba(255,255,255,.85);border-radius:12px;padding:10px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-height:180px;overflow-y:auto}
.log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.log-title{font-size:14px;font-weight:700;color:#5a3e2b}
.log-clear{font-size:11px;background:none;border:1px dashed #c0a080;color:#b08060;padding:2px 8px;border-radius:6px;cursor:pointer}
.log-entry{font-size:12px;color:#5a3e2b;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05);display:flex;gap:6px}
.log-time{color:#999;font-size:11px;white-space:nowrap;flex-shrink:0}
.log-msg{flex:1}

/* Bathtub */
.css-tub{width:80px;height:46px;position:relative}
.tub-body{width:80px;height:32px;background:#e8e8e8;border-radius:6px 6px 28px 28px;position:absolute;bottom:0;border:3px solid #bbb}
.tub-water{width:66px;height:18px;background:linear-gradient(180deg,#a0d8ef,#74b9ff);border-radius:0 0 22px 22px;position:absolute;bottom:6px;left:7px;overflow:hidden}
.tub-bubbles{position:absolute;top:-4px;left:8px;font-size:12px;opacity:.7}
.tub-feet-l,.tub-feet-r{position:absolute;bottom:-4px;width:8px;height:5px;background:#bbb;border-radius:0 0 3px 3px}
.tub-feet-l{left:12px}.tub-feet-r{right:12px}
/* Bath splash animation */
.tub-splash{position:absolute;top:-8px;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;font-size:14px}
.tub-splash.active{opacity:1;animation:splashUp 1.5s ease-out forwards}
@keyframes splashUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-18px)}}
/* Bowl eating animation */
.bowl-eating .bowl-food{animation:foodBounce .4s ease 5}
@keyframes foodBounce{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(.7)}}
/* Water drinking animation */
.water-drinking .water-inner{animation:waterDip .5s ease 4}
@keyframes waterDip{0%,100%{height:16px}50%{height:12px}}
/* Bed sleeping glow */
.bed-sleeping .bed-blanket{animation:blanketPulse 3s ease-in-out infinite}
@keyframes blanketPulse{0%,100%{opacity:.8}50%{opacity:1}}

/* Room toys */
.toys-shelf{display:flex;gap:16px;justify-content:center;margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.25);border-radius:10px}
.toy{position:relative;display:inline-block}
/* Ball */
.toy-ball{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#ee5a24);box-shadow:inset -3px -3px 6px rgba(0,0,0,.15),inset 2px 2px 4px rgba(255,255,255,.3)}
.toy-ball::after{content:"";position:absolute;top:5px;left:7px;width:8px;height:6px;background:rgba(255,255,255,.4);border-radius:50%}
/* Yarn ball */
.toy-yarn{width:30px;height:30px;border-radius:50%;background:#DDA0DD;position:relative;overflow:hidden}
.toy-yarn::before{content:"";position:absolute;top:4px;left:2px;width:26px;height:22px;border:2px solid #9370DB;border-radius:50%}
.toy-yarn::after{content:"";position:absolute;bottom:-2px;right:-3px;width:12px;height:4px;background:#DDA0DD;border-radius:2px;transform:rotate(-30deg)}
/* Blocks */
.toy-blocks{width:34px;height:30px;position:relative}
.toy-block{position:absolute;border-radius:2px}
.toy-block.b1{width:16px;height:16px;background:#FFD700;bottom:0;left:0;border:2px solid #e6b800}
.toy-block.b2{width:16px;height:16px;background:#87CEEB;bottom:0;right:0;border:2px solid #5ba3d9}
.toy-block.b3{width:15px;height:15px;background:#FF69B4;bottom:16px;left:5px;border:2px solid #e84393}
/* Teddy */
.toy-teddy{width:30px;height:34px;position:relative}
.teddy-body{width:22px;height:22px;background:#D2691E;border-radius:50%;position:absolute;bottom:0;left:4px}
.teddy-head{width:18px;height:18px;background:#D2691E;border-radius:50%;position:absolute;top:0;left:6px}
.teddy-ear{width:8px;height:8px;background:#A0522D;border-radius:50%;position:absolute;top:-2px}
.teddy-ear.L{left:3px}.teddy-ear.R{right:3px}
.teddy-face{width:6px;height:4px;background:#2c1810;border-radius:50%;position:absolute;top:7px;left:50%;transform:translateX(-50%)}
/* Rubber duck */
.toy-duck{width:30px;height:26px;position:relative}
.duck-body{width:26px;height:18px;background:#FFD700;border-radius:50%;position:absolute;bottom:0;left:2px}
.duck-head{width:15px;height:15px;background:#FFD700;border-radius:50%;position:absolute;top:0;right:2px}
.duck-beak{width:8px;height:4px;background:#FF8C00;border-radius:0 4px 4px 0;position:absolute;top:6px;right:-4px}
.duck-eye{width:4px;height:4px;background:#2c1810;border-radius:50%;position:absolute;top:4px;right:5px}

/* Poop */
.poop{position:absolute;font-size:14px;z-index:2;pointer-events:none;animation:poopDrop .3s ease-out}
@keyframes poopDrop{0%{transform:scale(0) translateY(-10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

/* New button colors */
.btn-bath{background:linear-gradient(135deg,#a0d8ef,#5ba3d9)}
.btn-clean{background:linear-gradient(135deg,#8B6914,#6B4F10)}

/* Cleanliness bar */
.room-bar-fill.clean{background:linear-gradient(90deg,#a0d8ef,#5ba3d9)}
.room-bar-fill.health{background:linear-gradient(90deg,#55efc4,#00b894)}
.room-bar-fill.aff-manual{background:linear-gradient(90deg,#fd79a8,#e84393)}
.room-bar-fill.aff-notion{background:linear-gradient(90deg,#a29bfe,#6c5ce7)}
.room-bar-fill.fatigue{background:linear-gradient(90deg,#dfe6e9,#636e72)}
.yard-bar-fill.c{background:#a0d8ef}

/* Yard-only toys */
.toy-straw{width:28px;height:24px;position:relative;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,#d4a856,#b8912a);border:2px solid #a07820;overflow:hidden}
.toy-straw::before{content:"";position:absolute;top:3px;left:3px;right:3px;bottom:3px;background:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.15) 2px,rgba(255,255,255,.15) 4px);border-radius:50%}
.toy-straw::after{content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:12px;height:5px;background:#c49a30;border-radius:50%}
.toy-log{width:32px;height:16px;position:relative;background:linear-gradient(180deg,#8B6914,#6B4F10);border-radius:8px;border:1px solid #5a4010}
.toy-log::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#a07820;border:1px solid #6B4F10}
.toy-log::after{content:"";position:absolute;right:2px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#a07820;border:1px solid #6B4F10}
.toy-stick{width:30px;height:6px;position:relative;background:linear-gradient(180deg,#a07820,#7a5c18);border-radius:3px;transform:rotate(-15deg)}
.toy-stick::before{content:"";position:absolute;right:-4px;top:-4px;width:10px;height:6px;background:#8B6914;border-radius:3px;transform:rotate(40deg)}


/* Buddy interaction bubble */
.buddy-bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:4px 10px;font-size:11px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:20;opacity:0;animation:bubblePop 3s ease forwards;pointer-events:none}
.buddy-bubble::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #fff}

/* Milestone toast */
.milestone-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#fff5f5,#ffe0ec);border:3px solid #fd79a8;border-radius:20px;padding:18px 28px;z-index:10000;box-shadow:0 8px 30px rgba(253,121,168,.4);text-align:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;max-width:90vw}
.milestone-toast.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.milestone-toast .ms-icon{font-size:36px;display:block;margin-bottom:4px}
.milestone-toast .ms-title{font-size:16px;font-weight:700;color:#e84393;margin-bottom:2px}
.milestone-toast .ms-msg{font-size:13px;color:#5a3e2b}
.milestone-toast .ms-level{font-size:11px;color:#6c5ce7;margin-top:4px;font-weight:600}
/* Floating hearts animation */
@keyframes heartRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
.ms-hearts{position:absolute;top:-10px;left:0;right:0;pointer-events:none;text-align:center}
.ms-heart{display:inline-block;font-size:16px;animation:heartRise 2s ease-out forwards;position:absolute}
@keyframes bubblePop{0%{opacity:0;top:-20px}10%{opacity:1;top:-30px}80%{opacity:1}100%{opacity:0;top:-40px}}
@keyframes buddyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

h1{font-size:20px}
.coop{width:60px}.coop-building{width:52px;height:44px}.coop-roof{top:-11px;left:-3px;right:-3px;height:14px}
.coop-door{width:14px;height:20px}.coop-name{font-size:8px}.coop-btn{font-size:8px;padding:1px 4px}
.chick.big{transform:scale(1.3);margin:18px 10px 6px}

/* ===== YARD DECORATIONS ===== */
/* Fence */
.yard-fence{position:absolute;bottom:0;left:0;right:0;height:28px;display:flex;gap:4px;padding:0 4px;pointer-events:none;z-index:2}
.fence-picket{flex:1;max-width:14px;background:linear-gradient(180deg,#b8860b,#8B6914);border-radius:3px 3px 0 0;border:1px solid #6B4F10;position:relative}
.fence-picket::after{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:2px;height:3px;background:#a07820;border-radius:1px}
.fence-rail{position:absolute;bottom:18px;left:0;right:0;height:3px;background:#8B6914;border:1px solid #6B4F10;z-index:2;pointer-events:none}
.fence-rail2{position:absolute;bottom:8px;left:0;right:0;height:3px;background:#8B6914;border:1px solid #6B4F10;z-index:2;pointer-events:none}

/* Trees */
.yard-tree{position:absolute;pointer-events:none;z-index:1}
.tree-trunk{width:10px;height:28px;background:linear-gradient(90deg,#6B4F10,#8B6914,#6B4F10);border-radius:2px;margin:0 auto}
.tree-canopy{width:40px;height:32px;background:radial-gradient(ellipse,#4a8c3f,#357a2a);border-radius:50%;position:relative;top:-8px;box-shadow:inset -3px -3px 6px rgba(0,0,0,.15),inset 2px 2px 4px rgba(100,200,50,.2);animation:treeSway 4s ease-in-out infinite}
.tree-canopy::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:28px;height:22px;background:radial-gradient(ellipse,#55a040,#3d8a30);border-radius:50%}
@keyframes treeSway{0%,100%{transform:rotate(0deg)}25%{transform:rotate(1.5deg)}75%{transform:rotate(-1.5deg)}}

/* Flowers */
.yard-flower{position:absolute;pointer-events:none;z-index:1;animation:flowerBob 3s ease-in-out infinite}
.flower-stem{width:2px;height:14px;background:#2d8a4e;margin:0 auto;border-radius:1px}
.flower-head{width:8px;height:8px;border-radius:50%;position:relative;top:-2px;margin:0 auto;box-shadow:inset -1px -1px 2px rgba(0,0,0,.15)}
.flower-head::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:3px;border-radius:50%;background:#FFD700}
@keyframes flowerBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* Butterflies */
.butterfly{position:absolute;pointer-events:none;z-index:4;animation:butterflyFloat 8s ease-in-out infinite}
.butterfly-body{width:2px;height:8px;background:#333;border-radius:1px;margin:0 auto;position:relative}
.butterfly-wing{position:absolute;top:1px;width:6px;height:5px;border-radius:50%;animation:wingFlap .3s ease-in-out infinite alternate}
.butterfly-wing.L{right:2px;transform-origin:right center}
.butterfly-wing.R{left:2px;transform-origin:left center}
@keyframes wingFlap{0%{transform:scaleX(1)}100%{transform:scaleX(.3)}}
@keyframes butterflyFloat{0%{transform:translate(0,0)}25%{transform:translate(20px,-15px)}50%{transform:translate(-10px,-25px)}75%{transform:translate(15px,-10px)}100%{transform:translate(0,0)}}
.butterfly:nth-child(2){animation-duration:10s;animation-direction:reverse}
.butterfly:nth-child(3){animation-duration:7s;animation-delay:-3s}
.yard-ground.rainy .butterfly,.yard-ground.snowy .butterfly{display:none}

/* Puddles */
.yard-puddles{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1}
.puddle{position:absolute;width:30px;height:10px;background:rgba(100,150,200,.35);border-radius:50%;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}

@keyframes ripple{0%{width:6px;height:2px;opacity:1}100%{width:24px;height:8px;opacity:0}}
.yard-puddles.hidden{display:none}

/* Lightning */
.lightning{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;pointer-events:none;opacity:0;z-index:50;transition:opacity .05s}
.lightning.flash{opacity:.7;transition:opacity .05s}

/* ===== BUDDY INTERACTION ANIMATIONS ===== */
.yard-chicken.buddy-chase{animation:buddyChase .6s ease 3}
@keyframes buddyChase{0%,100%{transform:translateX(0)}50%{transform:translateX(15px)}}

.yard-chicken.buddy-play{animation:buddyPlay .5s ease 4}

/* ===== YARD EFFECTS ===== */

@keyframes yardEffectPop{0%{opacity:0;transform:translateX(-50%) translateY(0)}15%{opacity:1}80%{opacity:1;transform:translateX(-50%) translateY(-15px)}100%{opacity:0;transform:translateX(-50%) translateY(-25px)}}

/* ===== PET ROOM ANIMATIONS ===== */

@keyframes storyB{0%,100%{transform:scale(1.7) rotate(0)}30%{transform:scale(1.7) rotate(5deg)}70%{transform:scale(1.7) rotate(-5deg)}}
</style>
</head>

// ===== HELPERS =====
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function pickN(a,n){const c=[...a],r=[];for(let i=0;i<n&&c.length;i++){const j=Math.floor(Math.random()*c.length);r.push(c.splice(j,1)[0])}return r}
function cl(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function days(){return Math.max(1,Math.floor((Date.now()-new Date(S.startDate).getTime())/864e5)+1)}
function nowStr(){const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Toronto"}));const pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function torontoISO(){return new Date().toLocaleString("sv-SE",{timeZone:"America/Toronto"}).replace(" ","T")+"-04:00"}
function gPct(c){
  const ranges={baby:[0,1000],teen:[1000,2400],mature:[2400,5000],adult:[5000,8000]};
  if(c.stage==="elder")return 100;
  const r=ranges[c.stage]||[0,1000];
  const total=c.totalHunger+c.totalHappiness;
  return cl(Math.floor((total-r[0])/(r[1]-r[0])*100),0,100);
}
function stgN(s){return{baby:"幼年",teen:"成长期",mature:"���熟期",adult:"成年",elder:"老��"}[s]||"幼年"}

// ===== EXPRESSIONS =====
function getExpr(c){
  if(c.sleeping)return"sleep";
  if(c.health<20)return"cry";
  if(c.fatigue>80)return"meh";
  if(c.hunger<20&&c.happiness<20)return"cry";
  if(c.hunger<20)return"sad";
  if(c.happiness<20)return"upset";
  if(c.thirst<20)return"meh";
  if(c.clean<20)return"meh";
  if(c.hunger>=80&&c.happiness>=80&&c.thirst>=60&&c.clean>=60)return"satisfied";
  if(c.happiness>=60)return"happy";
  return"normal";
}
function getStatus(c){
  if(c.sleeping)return"睡觉中…";
  if(c.hunger<20&&c.happiness<20)return"又饿又不开心";
  if(c.hunger<20)return"饿了";
  if(c.happiness<20)return"不开心";
  if(c.thirst<20)return"渴了";
  if(c.clean<20)return"脏脏的…";
  if(c.hunger>=80&&c.happiness>=80)return"很满足~";
  return"";
}

// ===== STATE =====
function randPrefs(){
  const fi=FOODS.map(f=>f.id),gi=GAMES.map(g=>g.id);
  const fv=pickN(fi,2),rm=fi.filter(f=>!fv.includes(f)),ht=pickN(rm,2);
  const fg=pick(gi),hg=pick(gi.filter(g=>g!==fg));
  return{favoriteFood:fv,hatedFood:ht,favoriteGame:fg,hatedGame:hg};
}
function defState(){
  const now=new Date().toISOString();
  return{
    chickens:CDEFS.map((d,i)=>({
      id:i,name:d.name,hunger:50,happiness:50,thirst:50,clean:80,health:100,fatigue:0,
      affManual:0,affNotion:0,heater:0,lamp:0,light:false,curtain:true,
      stage:"baby",totalHunger:0,totalHappiness:0,
      location:"outside",sleeping:false,...randPrefs()
    })),
    food:20,poops:[],buddyAff:{},startDate:now,totalInteractions:0,lastUpdateTime:now
  };
}
function save(){S.lastUpdateTime=new Date().toISOString();localStorage.setItem(SK,JSON.stringify(S));scheduleStateSync()}
function offlineActivities(rounds){
  for(let r=0;r<rounds;r++){
    S.chickens.forEach(c=>{
      if(c.sleeping||c.location==="inside")return;
      if(Math.random()>0.5)return;
      // Auto clean poop
      if(S.poops.length>0&&Math.random()<0.3){
        S.poops.splice(Math.floor(Math.random()*S.poops.length),1);
        addLog(`🧹 ${c.name} 你不在时把粑粑踢走了`,c.name,"清粑粑",c);return;
      }
      // Pick action by need
      if(c.hunger<50&&S.food>0){
        const f=pick(FOODS);let h=20;
        if(c.favoriteFood.includes(f.id)){h=30;c.happiness=cl(c.happiness+8,0,100)}
        else if(c.hatedFood.includes(f.id)){h=10;c.happiness=cl(c.happiness-5,0,100)}
        const ah=Math.min(h,100-c.hunger);c.hunger=cl(c.hunger+h,0,100);c.totalHunger+=Math.max(0,ah);S.food--;
        addLog(`🌾 ${c.name} 你不在时自己吃了${f.icon}${f.name}`,c.name,"吃饭",c);
      }else if(c.happiness<50){
        const g=pick(GAMES);let p=20,hc=10;
        if(c.favoriteGame===g.id){p=30;hc=5}else if(c.hatedGame===g.id){p=10;hc=15}
        const ap=Math.min(p,100-c.happiness);c.happiness=cl(c.happiness+p,0,100);c.hunger=cl(c.hunger-hc,0,100);c.totalHappiness+=Math.max(0,ap);
        addLog(`🎮 ${c.name} 你不在时自己玩了${g.icon}${g.name}`,c.name,"玩耍",c);
      }else if(c.thirst<50){
        c.thirst=cl(c.thirst+20,0,100);
        addLog(`💧 ${c.name} 你不在时自己喝了水`,c.name,"喝水",c);
      }else if(c.clean<40){
        c.clean=cl(c.clean+25,0,100);c.happiness=cl(c.happiness+5,0,100);
        addLog(`🛁 ${c.name} 你不在时自己洗了澡`,c.name,"洗澡",c);
      }
      // Auto poop
      if(Math.random()<0.2)S.poops.push({x:5+Math.random()*85,y:10+Math.random()*70,id:Date.now()+Math.random()+r});
    });
  }
}
function load(){
  try{
    const r=localStorage.getItem(SK);
    if(r){S=JSON.parse(r);
      // migrate
      S.chickens.forEach(c=>{if(c.thirst===undefined)c.thirst=50;if(c.clean===undefined)c.clean=80;if(c.health===undefined)c.health=100;if(c.fatigue===undefined)c.fatigue=0;if(c.affManual===undefined)c.affManual=0;if(c.affNotion===undefined)c.affNotion=0;if(c.heater===undefined)c.heater=0;if(c.lamp===undefined)c.lamp=0;if(c.light===undefined)c.light=false;if(c.curtain===undefined)c.curtain=true;});
      if(!S.poops)S.poops=[];if(!S.buddyAff)S.buddyAff={};if(!S.milestones)S.milestones={};if(!S.buddyMilestones)S.buddyMilestones={};
      const m=Math.floor((Date.now()-new Date(S.lastUpdateTime).getTime())/6e4);
      if(m>0){
        S.chickens.forEach(c=>{if(!c.sleeping){c.hunger=cl(c.hunger-m*2,0,100);c.happiness=cl(c.happiness-m*1,0,100);c.thirst=cl(c.thirst-m*2,0,100);c.clean=cl(c.clean-m*1,0,100);c.fatigue=cl(c.fatigue+m*1,0,100);if(c.hunger<20||c.thirst<20)c.health=cl(c.health-m*2,0,100)}else{c.fatigue=cl(c.fatigue-m*3,0,100);c.health=cl(c.health+m,0,100)}});
        // Simulate offline auto-activities (1 round per 30 min away)
        const rounds=Math.min(Math.floor(m/0.5),20);
        // Offline food regen: +1 per 2 min, max 30
        const foodGain=Math.min(Math.floor(m/2),30-S.food);
        if(foodGain>0){S.food=cl(S.food+foodGain,0,30);addLog(`🌱 你不在时院子里长出了${foodGain}份新食物`);}
        if(rounds>0)offlineActivities(rounds);
      }
      updStages();save();return}
  }catch(e){}
  S=defState();save();
}
function updStages(){
  S.chickens.forEach(c=>{
    const t=c.totalHunger+c.totalHappiness;
    const oldStage=c.stage;
    if(t>=8000)c.stage="elder";
    else if(t>=5000)c.stage="adult";
    else if(t>=2400)c.stage="mature";
    else if(t>=1000)c.stage="teen";
    else c.stage="baby";
    if(oldStage!==c.stage){
      const msgs={teen:`${c.name}开始长大了，进入成长期！羽毛变得更漂亮了~`,mature:`${c.name}越来越成熟了！长出了小鸡冠，好威风~`,adult:`${c.name}终于长大成年了！变成了一只漂亮的大鸡！`,elder:`${c.name}步入了老年，戴上了小眼镜，变得更有智慧了~`};
      const icons={teen:"🌱",mature:"🌿",adult:"🌟",elder:"👴"};
      addLog(`${icons[c.stage]||"🌟"} [成长] ${msgs[c.stage]||c.name+"成长了！"}`,c.name,"状态",c);
    }
  });
}

// ===== WEATHER (Real-time Toronto) =====
async function fetchTorontoWeather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=43.6532&longitude=-79.3832&current=temperature_2m,weather_code&timezone=America/Toronto");
    if(!r.ok)return;
    const d=await r.json();
    const code=d.current.weather_code;
    weatherTemp=Math.round(d.current.temperature_2m);
    // WMO weather codes: 0-1 sunny, 2-3 cloudy, 51-67 rain/drizzle, 71-77 snow, 80-82 rain showers, 85-86 snow showers, 95-99 thunderstorm
    if(code<=1)weather="sunny";
    else if(code<=3)weather="cloudy";
    else if((code>=51&&code<=67)||(code>=80&&code<=82)||code>=95)weather="rainy";
    else if((code>=71&&code<=77)||(code>=85&&code<=86))weather="snowy";
    else weather="cloudy";
    applyWeather();
  }catch(e){console.log("Weather fetch error:",e)}
}
function initWeather(){
  fetchTorontoWeather();
  setInterval(fetchTorontoWeather,600000); // refresh every 10 min
}
function applyWeather(){
  const sky=document.getElementById("sky");
  sky.className="sky "+weather;
  const badge=document.getElementById("weatherBadge");
  const tempStr=weatherTemp!==null?` ${weatherTemp}°C`:"";
  if(weather==="sunny")badge.textContent="☀️ 晴天"+tempStr;
  else if(weather==="cloudy")badge.textContent="⛅ 多云"+tempStr;
  else if(weather==="snowy")badge.textContent="🌨️ 下雪"+tempStr;
  else badge.textContent="🌧️ 下雨"+tempStr;
  // Generate raindrops or snowflakes
  const rain=document.getElementById("rain");
  if(weather==="rainy"&&!rain.querySelector(".raindrop")){
    let h="";
    for(let i=0;i<30;i++){
      const l=Math.random()*100,d=Math.random()*2+0.5,del=Math.random()*2,ht=Math.random()*12+6;
      h+=`<div class="raindrop" style="left:${l}%;height:${ht}px;animation-duration:${d}s;animation-delay:${del}s"></div>`;
    }
    rain.innerHTML=h;
  }else if(weather==="snowy"&&!rain.querySelector(".snowflake")){
    let h="";
    const flakes=["❄","❅","❆","*"];
    for(let i=0;i<25;i++){
      const l=Math.random()*100,d=Math.random()*4+3,del=Math.random()*3,sz=8+Math.random()*6;
      h+=`<div class="snowflake" style="left:${l}%;font-size:${sz}px;animation-duration:${d}s;animation-delay:${del}s">${pick(flakes)}</div>`;
    }
    rain.innerHTML=h;
  }else if(weather!=="rainy"&&weather!=="snowy"){rain.innerHTML="";}
}

function genGrass(el){
  let h="";
  for(let i=0;i<20;i++){
    const x=Math.random()*95,y=Math.random()*80+10;
    const blades=[
      `height:${8+Math.random()*6}px;background:#4a8;transform:rotate(${-15+Math.random()*30}deg);left:0`,
      `height:${6+Math.random()*5}px;background:#5b9;transform:rotate(${-10+Math.random()*20}deg);left:4px`,
      `height:${7+Math.random()*5}px;background:#4a8;transform:rotate(${-20+Math.random()*40}deg);left:8px`
    ];
    h+=`<div class="grass" style="left:${x}%;top:${y}%">${blades.map(b=>`<div class="grass-blade" style="${b}"></div>`).join("")}</div>`;
  }
  el.insertAdjacentHTML("beforeend",h);
}

      let p=20,hc=10;
      if(c.favoriteGame===gid){p=30;hc=5}else if(c.hatedGame===gid){p=10;hc=15}
      const a=Math.min(p,100-c.happiness);c.happiness=cl(c.happiness+p,0,100);c.hunger=cl(c.hunger-hc,0,100);c.totalHappiness+=Math.max(0,a);
    });
    const gn=GAMES.find(x=>x.id===gid);S.totalInteractions++;S.chickens.forEach(x=>{if(x.location==="outside"&&!x.sleeping){const ov=x.affManual;x.affManual+=1;checkAffMilestone(x.id,"manual",ov,x.affManual)}});setCD("yard","play");updStages();save();
    addLog(`🎮 你带小鸡们玩了${gn?gn.icon+gn.name:"游戏"}`,"全部","玩耍");renderYard();
  });
}
function yardDrink(){
  if(getCD("yard","drink")>0)return;
  S.chickens.forEach(c=>{if(c.location==="outside"&&!c.sleeping)c.thirst=cl(c.thirst+25,0,100)});
  S.totalInteractions++;S.chickens.forEach(x=>{if(x.location==="outside"&&!x.sleeping){const ov=x.affManual;x.affManual+=1;checkAffMilestone(x.id,"manual",ov,x.affManual)}});setCD("yard","drink");save();addLog("💧 你给院子里的小鸡们喝水了","全部","喝水");renderYard();
}
function yardSleep(){
  if(getCD("yard","sleep")>0)return;
  S.chickens.forEach(c=>{
    if(c.location!=="outside"||c.sleeping)return;
    if(c.hunger<80){c.totalHunger+=80-c.hunger;c.hunger=80}
    if(c.happiness<80){c.totalHappiness+=80-c.happiness;c.happiness=80}
    if(c.thirst<80)c.thirst=80;if(c.clean<80)c.clean=80;
  });
  S.totalInteractions++;S.chickens.forEach(x=>{if(x.location==="outside"&&!x.sleeping){const ov=x.affManual;x.affManual+=1;checkAffMilestone(x.id,"manual",ov,x.affManual)}});setCD("yard","sleep");updStages();save();addLog("💤 你让小鸡们都去休息了","全部","睡觉");renderYard();
}
function yardBath(){
  if(getCD("yard","bath")>0)return;
  S.chickens.forEach(c=>{if(c.location==="outside"&&!c.sleeping){c.clean=cl(c.clean+30,0,100);c.happiness=cl(c.happiness+5,0,100)}});
  S.totalInteractions++;S.chickens.forEach(x=>{if(x.location==="outside"&&!x.sleeping){const ov=x.affManual;x.affManual+=1;checkAffMilestone(x.id,"manual",ov,x.affManual)}});setCD("yard","bath");save();addLog("🛁 你给院子里的小鸡们洗澡了","全部","洗澡");renderYard();
}
function yardClean(){
  if(S.poops.length===0)return;
  S.poops=[];S.totalInteractions++;save();addLog("🧹 你把粑粑都清理干净了","全部","清粑粑");renderYard();
}

function yardPet(){
  if(getCD("yard","pet")>0)return;
  openSel("选择和小鸡们互动",PETS.map(p=>({...p,type:"pet"})),function(pid){
    const pet=PETS.find(p=>p.id===pid);if(!pet)return;
    S.chickens.forEach(c=>{
      if(c.location!=="outside"||c.sleeping)return;

function openRoomFeed(){
  const c=S.chickens[roomId];
  if(!c||c.sleeping||S.food<=0||getCD(roomId,"feed")>0)return;
  openSel("选择食物给 "+c.name,FOODS.map(f=>({...f,type:"food"})),doRoomFeed);
}
function doRoomFeed(fid){
  const c=S.chickens[roomId];if(!c||c.sleeping||S.food<=0)return;
  let hA,pA,ex;
  if(c.favoriteFood.includes(fid)){hA=30;pA=10;ex="love"}
  else if(c.hatedFood.includes(fid)){hA=10;pA=-10;ex="upset"}
  else{hA=20;pA=0;ex="happy"}
  const ah=Math.min(hA,100-c.hunger);
  c.hunger=cl(c.hunger+hA,0,100);c.happiness=cl(c.happiness+pA,0,100);
  c.totalHunger+=Math.max(0,ah);if(pA>0)c.totalHappiness+=Math.min(pA,100-c.happiness+pA);
  S.food--;S.totalInteractions++;{const ov=c.affManual;c.affManual+=2;checkAffMilestone(c.id,"manual",ov,c.affManual)}setCD(roomId,"feed");updStages();save();
  const fn2=FOODS.find(x=>x.id===fid);addLog(`🌾 你给${c.name}喂了${fn2?fn2.icon+fn2.name:"食物"}`,c.name,"吃饭",c);
  setRoomExpr(ex,"anim-eat");
  showReact(c.favoriteFood.includes(fid)?"好吃！😍":c.hatedFood.includes(fid)?"不喜欢…😣":"吃饱啦~😊");
  moveToFurniture("furBowl");
  const bw=document.getElementById("cssBowl");if(bw)bw.classList.add("bowl-eating");
  setTimeout(()=>{if(bw)bw.classList.remove("bowl-eating");renderRoom()},2200);
}

function doRoomPlay(gid){

  else{pA=20;hC=10;ex="happy"}
  const ap=Math.min(pA,100-c.happiness);
  c.happiness=cl(c.happiness+pA,0,100);c.hunger=cl(c.hunger-hC,0,100);
  c.totalHappiness+=Math.max(0,ap);S.totalInteractions++;{const ov=c.affManual;c.affManual+=2;checkAffMilestone(c.id,"manual",ov,c.affManual)}
  setCD(roomId,"play");updStages();save();
  addLog(`🎮 你带${c.name}玩了${game?game.icon+game.name:"游戏"}`,c.name,"玩耍",c);

  if(c.thirst<80)c.thirst=80;if(c.clean<80)c.clean=80;c.fatigue=cl(c.fatigue-30,0,100);

  addLog(`💤 ${c.name}去睡觉了，晚安~`,c.name,"睡觉",c);

    props["健康"]={number:item.stats.health};
    props["疲惫"]={number:item.stats.fatigue};
    if(item.stats.affManual!==undefined)props["亲密手动"]={number:item.stats.affManual};
    if(item.stats.affNotion!==undefined)props["亲密指令"]={number:item.stats.affNotion};
    if(item.stats.heater!==undefined)props["暖气"]={number:item.stats.heater};

    if(item.stats.stage!==undefined)props["阶段"]={select:{name:stgN(item.stats.stage)}};
    if(item.stats.totalHunger!==undefined&&item.stats.totalHappiness!==undefined)props["成长进度"]={number:gPct(item.stats)};
    // Buddy affinity summary
    if(item.stats.id!==undefined&&S.buddyAff){
      const parts=[];
      S.chickens.forEach(c2=>{
        if(c2.id===item.stats.id)return;
        const v=getBuddyAff(item.stats.id,c2.id);
        if(v>0){
          const bl=BUDDY_LEVELS.slice().reverse().find(l=>v>=l.threshold);
          parts.push(`${c2.name}:${v}${bl?"("+bl.level+")":""}`);
        }
      });
      if(parts.length)props["好友"]={rich_text:[{text:{content:parts.join(" | ")}}]};
    }
  }
  try{
    const r=await fetch(NOTION_PROXY+"v1/pages",{
      method:"POST",
      headers:{"Authorization":"Bearer "+NOTION_TOKEN,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
      body:JSON.stringify({parent:{database_id:NOTION_DB},properties:props})
    });

}

async function pollInstructions(){
  if(!NOTION_TOKEN||!NOTION_DB)return;
  try{
    const r=await fetch(NOTION_PROXY+"v1/databases/"+NOTION_DB+"/query",{
      method:"POST",
      headers:{"Authorization":"Bearer "+NOTION_TOKEN,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
      body:JSON.stringify({filter:{and:[{property:"类型",select:{equals:"指令"}},{property:"已执行",checkbox:{equals:false}}]},sorts:[{timestamp:"created_time",direction:"ascending"}]})
    });
    if(!r.ok)return;
    const data=await r.json();
    if(!data.results||data.results.length===0)return;
    for(const page of data.results){
      const titleArr=page.properties["Name"]?.title;
      const cmd=titleArr&&titleArr.length>0?titleArr[0].plain_text:"";
      if(!cmd)continue;
      execInstruction(cmd,page.id);
    }
  }catch(e){console.log("Instruction poll error:",e)}
}

function showInstrToast(cmd,ok){

async function markInstrDone(pageId){
  if(!NOTION_TOKEN)return;
  try{
    await fetch(NOTION_PROXY+"v1/pages/"+pageId,{
      method:"PATCH",
      headers:{"Authorization":"Bearer "+NOTION_TOKEN,"Notion-Version":"2022-06-28","Content-Type":"application/json"},
      body:JSON.stringify({properties:{"已执行":{checkbox:true}}})

  {threshold:30,level:"朋友",icon:"🤝",manual:["#name#用小脑袋蹭了蹭你的手","#name#开心地扑扇翅膀欢迎你！"],notion:["#name#已经很信任你的指令了","#name#看到新指令会开心地叽叽叫"]},
  {threshold:50,level:"好朋友",icon:"💕",manual:["#name#开心地蹭过来要你摸摸头","#name#跳到你手上不肯走了"],notion:["#name#对你的指令充满期待","#name#觉得你是最好的主人！"]},
  {threshold:80,level:"挚友",icon:"💖",manual:["#name#发出了幸福的咕咕声~","#name#紧紧地靠在你身边"],notion:["#name#只要是你说的都会开心地去做","#name#每次收到指令都像收到礼物一样"]},
  {threshold:120,level:"至亲",icon:"👑",manual:["#name#觉得你是世界上最好的人！","#name#对你露出了最灿烂的笑容"],notion:["#name#已经把你当成家人了","#name#对你的信任无可替代"]}
];
function getAffLevel(val){
  let lv=null;
  for(const l of AFF_LEVELS)if(val>=l.threshold)lv=l;
  return lv;
}
function checkAffMilestone(ci,type,oldVal,newVal){
  const c=S.chickens[ci];if(!c)return;
  if(!S.milestones)S.milestones={};
  for(const lv of AFF_LEVELS){
    if(oldVal<lv.threshold&&newVal>=lv.threshold){
      const key=ci+"_"+type+"_"+lv.threshold;
      if(S.milestones[key])continue;
      S.milestones[key]=true;
      const msgs=type==="manual"?lv.manual:lv.notion;
      const msg=msgs[Math.floor(Math.random()*msgs.length)].replace(/#name#/g,c.name);
      const typeLabel=type==="manual"?"手动":"指令";
      showMilestoneToast(c.name,lv,msg,typeLabel);
      c.happiness=cl(c.happiness+10,0,100);
      addLog(`💝 [亲密里程碑] ${c.name}的${typeLabel}亲密达到${lv.level}(${lv.threshold})！${msg}`,c.name,"互动",c);
      save();
    }
  }
}
function showMilestoneToast(name,lv,msg,typeLabel){
  let t=document.getElementById("milestoneToast");
  if(!t){t=document.createElement("div");t.id="milestoneToast";t.className="milestone-toast";document.body.appendChild(t)}
  t.innerHTML=`<div class="ms-icon">${lv.icon}</div><div class="ms-title">亲密度提升！</div><div class="ms-msg">${msg}</div><div class="ms-level">${name} · ${typeLabel}亲密 · ${lv.level}</div>`;
  t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
  // Floating hearts
  const hearts=document.createElement("div");hearts.className="ms-hearts";
  for(let i=0;i<6;i++){const h=document.createElement("span");h.className="ms-heart";h.textContent=pick(["💕","💖","✨","🌟","💗","❤️"]);h.style.left=(15+Math.random()*70)+"%";h.style.animationDelay=(Math.random()*0.8)+"s";hearts.appendChild(h)}
  t.appendChild(hearts);
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>{if(hearts.parentNode)hearts.remove()},400)},3500);
}

// ===== BUDDY SYSTEM =====
function buddyKey(a,b){return a<b?a+":"+b:b+":"+a}
function addBuddyAff(a,b,amt){const k=buddyKey(a,b);S.buddyAff[k]=(S.buddyAff[k]||0)+amt}
function getBuddyAff(a,b){return S.buddyAff[buddyKey(a,b)]||0}
function bestBuddy(ci){
  let best=-1,bestV=-1,worst=-1,worstV=Infinity;
  S.chickens.forEach((c,j)=>{if(j===ci)return;const v=getBuddyAff(ci,j);if(v>bestV){bestV=v;best=j}if(v<worstV){worstV=v;worst=j}});
  return{best,bestV,worst,worstV};
}

    [`${a}偷了${b}的${pick(["食物","小虫子","宝贝石头","草莓"])}`,`${b}：${pick(["还给我！","哼，下次不理你了","追上去抢回来了","算了送你了","气鼓鼓地看着"+a])}`],
    [`${a}给${b}${pick(["梳了梳毛","理了理羽毛","擦了擦脸","整了整鸡冠"])}`,`${b}${pick(["开心地叫了两声","变漂亮了，臭美地抖了抖","乖乖站着不动","舒服得闭上了眼"])}`],
    [`${a}追着${b}跑`,`${b}：${pick(["你追不到我！","啊啊别追了！","哈哈哈太慢了","不小心摔了一跤，"+a+"赶紧跑过去扶"])}`],
    [`${a}和${b}叽叽喳喳聊天`,`${pick(["聊得好开心~","它们好像在讨论今天吃什么","越聊越起劲",""+b+"讲了个笑话，"+a+"笑得打滚",""+a+"说到一半忘词了"])}`]
  ];
  // Higher affinity = more intimate actions
  const intimate=[
    [`${a}靠在${b}身边打盹`,`${b}用翅膀轻轻盖住了${a}`],
    [`${a}把最好吃的留给了${b}`,`${b}感动地蹭了蹭${a}`],
    [`${a}和${b}互相梳毛`,`它们看起来好幸福~`],
    [`${a}和${b}紧紧挨在一起`,`${pick(["世界上最温暖的角落","好甜啊这两只","谁都不许打扰它们"])}`],
    [`${a}轻轻啄了一下${b}的脸`,`${b}${pick(["害羞地把头埋进翅膀","回啄了一下","脸红了（如果鸡能脸红的话）"])}`]
  ];
  const w=weather;
  const weatherActs=[];
  if(w==="rainy")weatherActs.push([`${a}和${b}一起在雨里踩水坑`,`${pick(["溅了一身泥，但好开心",""+b+"被溅了一脸水","它们玩疯了"])}`],[`${a}给${b}挡雨`,`${b}感动得直叫`]);
  if(w==="snowy")weatherActs.push([`${a}和${b}一起看雪`,`${pick(["好漂亮的雪花~",""+a+"接住了一片雪花","它们在雪地里留下小脚印"])}`],[`${a}和${b}挤在一起取暖`,`好暖和~`]);
  if(w==="sunny")weatherActs.push([`${a}和${b}一起晒太阳`,`${pick(["暖洋洋的~","晒得都不想动了",""+b+"翻了个身继续晒"])}`]);
  // Combine pools
  const pool=[...talks];
  if(aff>=20)pool.push(...intimate);
  if(weatherActs.length)pool.push(...weatherActs);
  // Joint activities
  const act=pick(acts);
  pool.push([`${a}和${b}${act}`,`${pick(["好开心~","它们玩得不亦乐乎","哈哈太好玩了","输了的不服气，要再来一次","两只都累了，但很满足"])}`]);
  return pick(pool);
}
const BUDDY_LEVELS=[
  {threshold:5,level:"认识",msgs:["{a}和{b}开始互相点头打招呼了","{a}和{b}会在一起吃饭了"]},
  {threshold:15,level:"玩伴",msgs:["{a}和{b}开始经常一起玩了！","{a}一看到{b}就开心地跑过去"]},
  {threshold:30,level:"好朋友",msgs:["{a}和{b}成了好朋友！走哪都要一起","{a}和{b}开始互相梳毛了，好亲密~"]},
  {threshold:50,level:"闺蜜/铁哥们",msgs:["{a}和{b}形影不离！","{a}把最好吃的留给{b}，真友情！"]},
  {threshold:80,level:"灵魂伴侣",msgs:["{a}和{b}已经心有灵犀了！","{a}和{b}连睡觉都要挨着~"]}
];
function checkBuddyMilestone(id1,id2,aff){
  if(!S.buddyMilestones)S.buddyMilestones={};
  const c1=S.chickens[id1],c2=S.chickens[id2];
  for(const lv of BUDDY_LEVELS){
    const key=buddyKey(id1,id2)+"_"+lv.threshold;
    if(aff>=lv.threshold&&!S.buddyMilestones[key]){
      S.buddyMilestones[key]=true;
      const msg=lv.msgs[Math.floor(Math.random()*lv.msgs.length)].replace(/\{a\}/g,c1.name).replace(/\{b\}/g,c2.name);
      addLog(`💛 [友谊里程碑] ${c1.name}和${c2.name}的关系达到${lv.level}(${lv.threshold})！${msg}`,c1.name,"互动",c1);
      c1.happiness=cl(c1.happiness+8,0,100);c2.happiness=cl(c2.happiness+8,0,100);
    }
  }
}
function triggerBuddyEvent(){
  const outdoor=S.chickens.filter(c=>c.location==="outside"&&!c.sleeping);
  if(outdoor.length<2)return;
  const i1=Math.floor(Math.random()*outdoor.length);
  let i2=Math.floor(Math.random()*(outdoor.length-1));if(i2>=i1)i2++;
  const c1=outdoor[i1],c2=outdoor[i2];
  addBuddyAff(c1.id,c2.id,1);
  const aff=getBuddyAff(c1.id,c2.id);
  checkBuddyMilestone(c1.id,c2.id,aff);
  // Generate dynamic chat
  const chat=genBuddyChat(c1.name,c2.name,aff);
  const line1=chat[0],line2=chat[1];
  c1.happiness=cl(c1.happiness+3,0,100);c2.happiness=cl(c2.happiness+3,0,100);
  addLog(`🐥 ${line1} ${line2}`,c1.name,"闲逛",c1);
  if(view==="yard"){
    const el1=document.getElementById("yc"+c1.id);
    const el2=document.getElementById("yc"+c2.id);
    if(el1){el1.classList.add("buddy-active");const b=document.createElement("div");b.className="buddy-bubble";b.textContent=line1.replace(c1.name+"对"+c2.name+"说：","").replace(c1.name+"和"+c2.name,"").slice(0,15);el1.appendChild(b);setTimeout(()=>{b.remove();el1.classList.remove("buddy-active")},3500)}
    if(el2){el2.classList.add("buddy-active");const b=document.createElement("div");b.className="buddy-bubble";b.textContent=line2.replace(c2.name+"：","").replace(c2.name,"").slice(0,12);el2.appendChild(b);setTimeout(()=>{b.remove();el2.classList.remove("buddy-active")},3500)}
  }
  save();
}

let autoTimer=null;
function startAutoActivity(){
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=setInterval(()=>{
    S.chickens.forEach(c=>{
      if(c.sleeping||c.location==="inside")return;
      if(Math.random()>0.35)return; // 35% chance per chicken per tick
      // Pick action based on needs
      const needs=[];
      if(c.hunger<60)needs.push("eat");
      if(c.happiness<60)needs.push("play");
      if(c.thirst<60)needs.push("drink");
      if(c.clean<50)needs.push("bath");
      if(c.hunger<25)needs.push("eat"); // extra weight if very hungry
      if(c.thirst<25)needs.push("drink");
      if(needs.length===0){
        // Not needy - maybe clean poop or idle
        if(S.poops.length>0&&Math.random()<0.4){
          S.poops.splice(Math.floor(Math.random()*S.poops.length),1);
          addLog(`🧹 ${c.name} 把一坨粑粑踢走了，爱干净！`,c.name,"清粑粑",c);
          return;
        }
        const idle=pick(["wander","chat","nap"]);
        if(idle==="wander")addLog(`🐥 ${c.name} ${pick(["在院子里溜达~","到处走来走去找东西","绕着院子跑了一圈","好奇地东张西望","踢了一颗小石子玩"])}`,c.name,"闲逛",c);
        else if(idle==="chat")addLog(`🐥 ${c.name} ${pick(["叽叽喳喳地叫着","对着天空唱歌","自言自语嘟囔着什么","学其他鸡叫，怪怪的","哼着不知道哪里学来的小曲"])}`,c.name,"闲逛",c);
        else addLog(`🐥 ${c.name} ${pick(["打了个小盹儿","找了个舒服的地方趴下了","在阳光下眯了一会儿","靠着墙角睡着了","做了个美梦，嘴角上扬"])}`,c.name,"闲逛",c);
        return;
      }
      const act=pick(needs);
      if(act==="eat"&&S.food>0){
        const f=pick(FOODS);
        let h=20;
        if(c.favoriteFood.includes(f.id)){h=30;c.happiness=cl(c.happiness+8,0,100)}
        else if(c.hatedFood.includes(f.id)){h=10;c.happiness=cl(c.happiness-5,0,100)}
        const ah=Math.min(h,100-c.hunger);c.hunger=cl(c.hunger+h,0,100);c.totalHunger+=Math.max(0,ah);
        S.food--;
        if(c.favoriteFood.includes(f.id))addLog(`🌾 ${c.name} 自己吃了${f.icon}${f.name}，好吃！😍`,c.name,"吃饭",c);
        else if(c.hatedFood.includes(f.id))addLog(`🌾 ${c.name} 尝了口${f.icon}${f.name}，不喜欢…😣`,c.name,"吃饭",c);
        else addLog(`🌾 ${c.name} 自己吃了${f.icon}${f.name} 😊`,c.name,"吃饭",c);
      }else if(act==="play"){
        const g=pick(GAMES);
        let p=20,hc=10;
        if(c.favoriteGame===g.id){p=30;hc=5}else if(c.hatedGame===g.id){p=10;hc=15}
        const ap=Math.min(p,100-c.happiness);c.happiness=cl(c.happiness+p,0,100);c.hunger=cl(c.hunger-hc,0,100);c.totalHappiness+=Math.max(0,ap);
        if(c.favoriteGame===g.id)addLog(`🎮 ${c.name} 自己玩${g.icon}${g.name}，超开心！🥰`,c.name,"玩耍",c);
        else if(c.hatedGame===g.id)addLog(`🎮 ${c.name} 试了下${g.icon}${g.name}，不太想玩 😕`,c.name,"玩耍",c);
        else addLog(`🎮 ${c.name} 自己玩了${g.icon}${g.name} 😊`,c.name,"玩耍",c);
      }else if(act==="drink"){
        c.thirst=cl(c.thirst+20,0,100);
        addLog(`💧 ${c.name} 自己跑去喝水了，咕噜咕噜~`,c.name,"喝水",c);
      }else if(act==="bath"){
        c.clean=cl(c.clean+25,0,100);c.happiness=cl(c.happiness+5,0,100);
        addLog(`🛁 ${c.name} 自己去洗澡了，洗香香~ ✨`,c.name,"洗澡",c);
      }
    });
    // Random buddy interaction (30% chance per tick)
    if(Math.random()<0.3)triggerBuddyEvent();
    updStages();save();
    if(view==="yard")renderYard();
    else if(view==="room")renderRoom();
  },30000); // every 30 seconds
}

// ===== STATS =====
function renderStats(){
  document.getElementById("statsBar").innerHTML=
    `<span>🌾 食物: ${S.food}</span><span>💩 ${S.poops.length}</span><span>📅 ${nowStr()}</span><span>📅 第${days()}天</span><span>⭐ ${S.totalInteractions}次互动</span>`;
}

// ===== AUTO DECAY =====
function decay(){
  S.chickens.forEach(c=>{
    if(!c.sleeping){c.hunger=cl(c.hunger-2,0,100);c.happiness=cl(c.happiness-1,0,100);c.thirst=cl(c.thirst-2,0,100);c.clean=cl(c.clean-1,0,100);c.fatigue=cl(c.fatigue+1,0,100);if(c.hunger<20||c.thirst<20||c.clean<20||c.fatigue>80)c.health=cl(c.health-2,0,100)}else{c.fatigue=cl(c.fatigue-3,0,100);c.health=cl(c.health+1,0,100)}
    // Heater & lamp benefits (indoor only)
    if(c.location==="inside"&&c.heater>0){c.health=cl(c.health+c.heater*0.4,0,100);c.happiness=cl(c.happiness+c.heater*0.2,0,100)}
    if(c.location==="inside"&&c.lamp>0){c.health=cl(c.health+c.lamp*0.3,0,100);c.fatigue=cl(c.fatigue-c.lamp*0.3,0,100)}
  });
  // Auto food regen: +1 food every 2 minutes, max 30
  if(S.food<30){S.food++;if(S.food%5===0)addLog(`🌱 院子里长出了新食物，现在有${S.food}份`)}
  save();
  if(view==="yard")renderYard();
  else if(view==="room")renderRoom();
  renderStats();
}

// ===== RESET =====
function resetGame(){
  if(!confirm("确定要重置游戏吗？所有进度将丢失！"))return;
  localStorage.removeItem(SK);cds={};
  Object.values(wTimers).forEach(clearInterval);wTimers={};
  Object.values(sTimers).forEach(clearTimeout);sTimers={};
  if(rwTimer){clearInterval(rwTimer);rwTimer=null}
  if(autoTimer){clearInterval(autoTimer);autoTimer=null}
  actLog=[];
  view="yard";roomId=-1;
  document.getElementById("yardView").classList.remove("hidden");
  document.getElementById("roomView").classList.remove("active");
  S=defState();save();
  // Re-gen grass
  const g=document.getElementById("yardGround");
  g.querySelectorAll(".grass").forEach(el=>el.remove());
  genGrass(g);
  startAutoActivity();
  renderYard();renderStats();renderLog();
}

// ===== EVENTS =====
document.addEventListener("click",e=>{
  if(!e.target.closest(".yard-chicken")&&!e.target.closest(".chicken-menu"))hideMenu();
});

// ===== INIT =====
load();
genGrass(document.getElementById("yardGround"));
initWeather();
startPoopTimer();
startAutoActivity();
startInstrPoll();
renderYard();renderStats();renderLog();
setInterval(decay,60000);
setInterval(()=>{
  if(view==="room")renderRoomBtns();
  if(view==="yard")renderYardBtns();
  renderStats();
},1000);
window.addEventListener("beforeunload",save);
</script>
